<!doctype html>
<html lang="fa" dir="rtl" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مشخصات دیزل ژنراتور | داتیس آوان نیرو</title>
  <meta name="description" content="مشخصات فنی کامل دیزل ژنراتور و استعلام قیمت از داتیس آوان نیرو.">
  <meta name="theme-color" content="#242058">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/img/logo/icon-64.png">
  <link rel="apple-touch-icon" href="assets/img/logo/icon-180.png">
  <link rel="preload" href="assets/fonts/Vazirmatn-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>document.documentElement.classList.replace("no-js", "js");</script>
</head>
<body data-page="product">
  <a class="skip-link" href="#main">پرش به محتوای اصلی</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero frame blueprint on-dark">
      <div class="container">
        <nav class="breadcrumb" aria-label="مسیر صفحه">
          <a href="index.html">خانه</a><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
          <a href="products.html" id="pd-cat">ژنراتور</a><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
          <span aria-current="page" id="pd-crumb" class="ltr"></span>
        </nav>
        <h1 id="pd-title">در حال بارگذاری…</h1>
        <p id="pd-sub"></p>
      </div>
    </section>

    <section class="section" style="padding-top: 40px;">
      <div class="container" id="product"></div>
    </section>

    <section class="section section--white pd-only" style="padding-top: 48px;">
      <div class="container">
        <nav class="tabs" aria-label="بخش‌های صفحه">
          <a href="#specs-sec" class="is-active">مشخصات فنی</a>
          <a href="#features-sec">ویژگی‌ها</a>
          <a href="#quote">استعلام قیمت</a>
        </nav>
        <div id="specs-sec">
          <h2 class="sr-only">مشخصات فنی</h2>
          <div class="spec-groups" id="specs"></div>
          <p class="text-muted" id="spec-note" style="font-size:.875rem; margin-top:16px;"></p>
        </div>
        <div id="features-sec" style="margin-top: 56px;">
          <h2>ویژگی‌ها</h2>
          <ul class="features" id="features"></ul>
        </div>
      </div>
    </section>

    <section class="cta frame on-dark pd-only" id="quote">
      <div class="cta__bg"><img src="assets/img/install-open.jpg" alt="" loading="lazy" width="1200" height="800"></div>
      <div class="container">
        <div>
          <h2>قیمت <b>این مدل</b> را بپرسید.</h2>
          <div class="contacts">
            <a href="tel:+989156202183"><span class="icon-box"><svg class="icon" aria-hidden="true"><use href="#i-phone"></use></svg></span><span><small>تلفن</small><b data-site="phone"></b></span></a>
            <a data-site="whatsapp" href="#"><span class="icon-box"><svg class="icon" aria-hidden="true"><use href="#i-message-circle"></use></svg></span><span><small>واتس‌اپ</small><b>پیام بدهید</b></span></a>
          </div>
        </div>
        <div class="form-card">
          <h3>فرم استعلام قیمت</h3>
          <form data-quote novalidate>
            <div class="form-grid">
              <div class="field"><label for="p-name">نام و نام خانوادگی<span class="req" aria-hidden="true">*</span></label><input id="p-name" name="name" autocomplete="name" required aria-describedby="p-name-err"><span class="error" id="p-name-err" role="alert"></span></div>
              <div class="field"><label for="p-phone">شمارهٔ تماس<span class="req" aria-hidden="true">*</span></label><input id="p-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" required aria-describedby="p-phone-err"><span class="error" id="p-phone-err" role="alert"></span></div>
              <div class="field"><label for="p-model">مدل</label><select id="p-model" name="model"><option value="">انتخاب مدل</option></select></div>
              <div class="field"><label for="p-city">شهر محل نصب</label><input id="p-city" name="city" autocomplete="address-level2"></div>
              <div class="field full"><label for="p-msg">توضیحات</label><textarea id="p-msg" name="message" placeholder="تعداد، نیاز به ATS، نصب و حمل"></textarea></div>
            </div>
            <div class="form-foot">
              <small>با شما ظرف یک روز کاری تماس می‌گیریم.</small>
              <button class="btn btn--primary" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-send"></use></svg>ارسال درخواست</button>
            </div>
            <div class="form-status" role="status" aria-live="polite"></div>
          </form>
        </div>
      </div>
    </section>

    <section class="section related pd-only">
      <div class="container">
        <div class="sec-head">
          <div class="sec-head__text">
            <h2>مدل‌های مشابه</h2>
          </div>
          <a class="link-arrow" href="products.html" id="related-link">همهٔ ژنراتورها<svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg></a>
        </div>
        <div class="grid-products" id="related"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
