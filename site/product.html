<!doctype html>

<head>

  <link rel="icon" type="image/png" sizes="64x64" href="assets/img/logo/icon-64.png">
  <link rel="apple-touch-icon" href="assets/img/logo/icon-180.png">
  <link rel="preload" href="assets/fonts/Vazirmatn-wght.woff2" as="font" type="font/woff2" crossorigin>

<body data-page="product">
  <a class="skip-link" href="#main">پرش به محتوای اصلی</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="wrap page-hero">
      <nav class="crumbs" aria-label="مسیر صفحه"><a href="index.html">خانه</a><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg><a href="products.html" id="pd-cat">ژنراتور</a><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg><span aria-current="page" id="pd-crumb" class="ltr"></span></nav>
      <span class="eyebrow" id="pd-kicker" style="margin-top:14px;"></span>
      <h1 id="pd-title" style="margin-top:6px;">در حال بارگذاری…</h1>
      <p class="lede" id="pd-sub"></p>
    </section>

    <section class="wrap" id="product"></section>

    <section class="sec pd-only" id="specs-sec">
      <div class="wrap">
        <div class="head"><div><h2>مشخصات فنی</h2></div></div>
        <div class="spec-groups" id="specs"></div>
        <p class="note" id="spec-note"></p>
      </div>
    </section>

    <section class="sec pd-only">
      <div class="wrap wrap--read">
        <div class="head"><div><h2>ویژگی‌ها</h2></div></div>
        <div class="panel" id="features"></div>
      </div>
    </section>

    <section class="sec pd-only" id="quote">
      <div class="wrap quote">
        <div>
          <h2>قیمت این مدل را بپرسید.</h2>
          <p class="lede" style="margin-top:10px;">قیمت نهایی به تجهیزات جانبی، نصب و حمل بستگی دارد.</p>
          <div class="panel" style="margin-top:22px;">
            <a class="row" href="tel:+989156202183"><svg class="icon" aria-hidden="true"><use href="#i-phone"></use></svg><div class="row__main"><span class="row__title" data-site="phone"></span><span class="row__text">تلفن و واتس‌اپ</span></div></a>
            <a class="row" data-site="whatsapp" href="#"><svg class="icon" aria-hidden="true"><use href="#i-message-circle"></use></svg><div class="row__main"><span class="row__title">پیام در واتس‌اپ</span><span class="row__text">پاسخ سریع در ساعات کاری</span></div><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg></a>
            
          </div>
        </div>
        <div class="panel panel__pad">
          <form data-quote novalidate>
            <div class="form-grid"><div class="field"><label for="p-name">نام و نام خانوادگی<span class="req" aria-hidden="true">*</span></label><input id="p-name" name="name" autocomplete="name" required aria-describedby="p-name-err"><span class="error" id="p-name-err" role="alert"></span></div><div class="field"><label for="p-phone">شمارهٔ تماس<span class="req" aria-hidden="true">*</span></label><input id="p-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" required aria-describedby="p-phone-err"><span class="error" id="p-phone-err" role="alert"></span></div><div class="field"><label for="p-model">مدل</label><select id="p-model" name="model"><option value="">انتخاب مدل</option></select></div><div class="field"><label for="p-city">شهر محل نصب</label><input id="p-city" name="city" autocomplete="address-level2"></div><div class="field full"><label for="p-msg">توضیحات</label><textarea id="p-msg" name="message" placeholder="تعداد، نیاز به ATS، نصب و حمل"></textarea></div></div>
            <div class="form-foot">
              <small>اطلاعات شما فقط برای همین درخواست استفاده می‌شود.</small>
              <button class="btn" type="submit">ارسال درخواست</button>
            </div>
            <div class="form-status" role="status" aria-live="polite"></div>
          </form>
        </div>
      </div>
    </section>

    <section class="sec pd-only">
      <div class="wrap">
        <div class="head"><div><h2>مدل‌های مشابه</h2></div><a class="link" href="products.html" id="related-link">همهٔ ژنراتورها<svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg></a></div>
        <div class="grid" id="related"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
