<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ژنراتور دیزلی و گازی ۲۰۰ تا ۷۵۰ کیلووات | داتیس آوان نیرو</title>
  <meta name="description" content="ژنراتورهای روباز دیزلی و گازی ۲۰۰ تا ۷۵۰ کیلووات؛ فیلتر بر اساس توان، سوخت و برند موتور، با مشخصات فنی کامل هر مدل.">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/img/logo/icon-64.png">
  <link rel="apple-touch-icon" href="assets/img/logo/icon-180.png">
  <link rel="preload" href="assets/fonts/Vazirmatn-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="products">
  <a class="skip-link" href="#main">پرش به محتوای اصلی</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="wrap page-hero">
      <nav class="crumbs" aria-label="مسیر صفحه"><a href="index.html">خانه</a><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg><span aria-current="page">ژنراتور</span></nav>
      <h1>ژنراتور دیزلی و گازی</h1>
      <p class="lede">ژنراتورهای روباز ۲۰۰ تا ۷۵۰ کیلووات با موتورهای معتبر.</p>
      
    </section>

    <section class="sec" style="padding-top:8px;">
      <div class="wrap catalog">
        <form class="panel filters" id="filters" aria-label="فیلتر ژنراتورها">
          <div class="search-box">
            <label class="sr-only" for="q">جستجو</label>
            <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
            <input id="q" type="search" placeholder="مدل، توان یا موتور" autocomplete="off">
          </div>
          <fieldset class="fgroup" id="g-fuel"><legend>سوخت</legend></fieldset>
          <fieldset class="fgroup" id="g-range"><legend>توان</legend></fieldset>
          <fieldset class="fgroup" id="g-brand"><legend>برند موتور</legend></fieldset>
          <div class="filters__foot"><button type="button" id="reset">پاک کردن فیلترها</button></div>
        </form>
        <div>
          <div class="toolbar">
            <p class="toolbar__count" id="count" aria-live="polite"></p>
            <div class="actions" style="gap:8px;">
              <button type="button" class="btn btn--secondary btn--sm filters-toggle" id="filters-toggle" aria-controls="filters" aria-expanded="false">فیلترها</button>
              <label class="sr-only" for="sort">مرتب‌سازی</label>
              <select id="sort">
                <option value="power-asc">توان: کم به زیاد</option>
                <option value="power-desc">توان: زیاد به کم</option>
              </select>
            </div>
          </div>
          <div class="chips" id="chips"></div>
          <div class="grid" id="results"></div>
          <div class="panel empty" id="empty" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
            <h3>مدلی با این فیلترها پیدا نشد</h3>
            <div class="actions">
              <button type="button" class="btn btn--secondary" id="empty-reset">پاک کردن فیلترها</button>
              <a class="btn" href="contact.html#quote">درخواست مدل سفارشی</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
